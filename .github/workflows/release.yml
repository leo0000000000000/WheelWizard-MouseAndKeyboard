name: Auto Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Version from csproj
        id: version_extractor
        shell: pwsh
        run: |
          $file = "WheelWizard/WheelWizard.csproj"
          $match = Select-String -Path $file -Pattern '<Version>([^<]+)</Version>'
          $version = $match.Matches.Groups[1].Value
          $tag = "v$version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Versione rilevata da WheelWizard.csproj: $version (Tag: $tag)"

      - name: Build Executable
        shell: cmd
        run: build-win.bat

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_extractor.outputs.TAG }}
          name: Wheel Wizard ${{ steps.version_extractor.outputs.TAG }} (Keyboard & Mouse Edition)
          files: |
            **/publish/WheelWizard.exe
            **/WheelWizard.exe
          draft: false
          prerelease: false
          body: |
            A patched build of Wheel Wizard that automatically downloads and sets up WiiCompiled with native **Keyboard & Mouse support** (PR #162 by @GalaxisBeast).

            ### How to use
            1. Download `WheelWizard.exe` below.
            2. Run it, open **Settings** (gear icon) and select your clean PAL Mario Kart Wii dump (`RMCP01.iso` or `.wbfs`).
            3. Go back to the **Home** tab and click **Install**.
            4. Once completed, hit **Play**!

            ### In-Game Notes
            - Press **F10** while playing to configure keybindings and mouse sensitivity.
            - **Close the F10 menu before driving:** all inputs are captured while the settings bar is open.
            - If you change your keybindings, restart the game once to ensure they stick.

            *Credits to @patchzyy, @wanttobeeme and @GalaxisBeast.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}